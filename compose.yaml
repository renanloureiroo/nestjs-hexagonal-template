services:
  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    environment:
      TZ: UTC
    ports:
      - '3000:3000'
      - '4317:4317'
      - '4318:4318'

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: hexagonal_template
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: hexagonal_template
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5432:5432'
